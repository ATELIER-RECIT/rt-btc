<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT BTC</title>

button{background:#f7931a;color:white;border:none;padding:15px;width:100%;font-size:18px;border-radius:8px;cursor:pointer;font-weight:bold}
#qr{margin-top:25px}
#qr img{border:3px solid #f7931a;border-radius:10px}
</style>
</head>
<body>
<div class="box">
<h1>🧡 RT BTC</h1>
<p>Générateur QR Bitcoin</p>
<input type="text" id="txt" placeholder="Colle ton adresse BTC ici">

</div>
