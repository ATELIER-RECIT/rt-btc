<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RT BTC - QR Bitcoin</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f7931a; 
      margin: 0; 
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }
   .box { 
      background: white; 
      padding: 30px; 
      border-radius: 15px; 
      max-width: 400px; 
      width: 100%;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    h1 { color: #f7931a; margin: 0 0 10px 0; }
    p { color: #666; margin: 0 0 20px 0; }
    input { 
      width: 100%; 
      padding: 15px; 
      font-size: 16px; 
      border: 2px solid #ddd; 
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    button { 
      background: #f7931a; 
      color: white; 
      border: none; 
      padding: 15px; 
      width: 100%; 
      font-size: 18px; 
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:active { background: #e6840e; }
    #qr { margin-top: 25px; min-height: 260px; }
    #qr img { border: 3px solid #f7931a; border-radius: 10px; }
  </style>
