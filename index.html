<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RT BTC - Générateur QR Bitcoin</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial; 
      background: linear-gradient(135deg, #f7931a 0%, #ffb347 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card { 
      background: white; padding: 40px 30px; border-radius: 20px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 450px; width: 100%; text-align: center;
    }
    h1 { color: #f7931a; font-size: 28px; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 25px; font-size: 14px; }
    input { width: 100%; padding: 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px; }
    input:focus { outline: none; border-color: #f7931a; }
    button { 
      background: #f7931a; color: white; border: none; padding: 16px; 
      font-size: 18px; cursor: pointer; width: 100%; border-radius: 10px; font-weight: bold;
    }
    button:hover { background: #e6840e; }
    #qrcode { margin-top: 25px; min-height: 264px; display: flex; justify-content: center; }
    #qrcode canvas { border: 4px solid #f7931a; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧡 RT BTC</h1>
    <p>Générateur de QR Code Bitcoin instantané</p>
    <input type="text" id="btc" placeholder="Colle ton adresse BTC : bc1q...">
    <button onclick="generate()">Générer le QR Code</button>
    <div id="qrcode"></div>
  </div>
  <script>
    function generate() {
      const addr = document.getElementById('btc').value.trim();
      if(!addr) return alert('Mets une adresse BTC d\'abord !');
      document.getElementById('qrcode').innerHTML = '';
      QRCode.toCanvas(addr, { width: 256, margin: 2 }, function (err, canvas) {
        if (err) return alert('Erreur : adresse invalide');
        document.getElementById('qrcode').appendChild(canvas);
      });
    }
  </script>
</body>
</html>
